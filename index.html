<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="name" content="Charlotte K">
  <meta name="description" content="A ToDo List effecient for students">
  <title>InToDo</title>
  <link rel="stylesheet" href="css/styles.css">
  
</head>
<body>
  <h1> InToDo </h1>
  <p>Today is <span id="today"></span></p>
  <div class="todo-list">
    <div class="form">
      <input type="text", class="input-item", id="input-box", placeholder="Add Task"/>
      <select name="course" id="course" class="course">
        <option value="Class 1"> Class 1 </option>
        <option value="Class 2"> Class 2 </option>
        <option value="Class 3"> Class 3 </option>
        <option value="Class 4"> Class 4 </option>
      </select>
      <input type="date", class="date-item", id="date-box"/>

      <button id="add-list" onclick="addItem()"> Add </button>
    </div>

    <h2> Tasks </h2>

    <table class="task-table" id="task-list">
      <tr><th>Done</th><th>Task Name</th><th>Course</th><th>Due Date</th></tr>
    </table>
  </div>
  <script src="script.js"></script>
</body>
</html>
